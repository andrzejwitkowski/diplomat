name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode CI keystore
        uses: ./.github/actions/decode-ci-keystore
        with:
          keystore_base64: ${{ secrets.DIPLOMAT_KEYSTORE_BASE64 }}

      - name: Build debug APK
        env:
          DIPLOMAT_KEYSTORE_PASSWORD: ${{ secrets.DIPLOMAT_KEYSTORE_PASSWORD }}
          DIPLOMAT_KEY_ALIAS: ${{ secrets.DIPLOMAT_KEY_ALIAS }}
          DIPLOMAT_KEY_PASSWORD: ${{ secrets.DIPLOMAT_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diplomat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
