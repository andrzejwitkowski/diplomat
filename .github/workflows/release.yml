name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      semver:
        description: Semver version (e.g. 1.3.0)
        required: true
        type: string
      version_code:
        description: Android versionCode for OTA (optional; defaults to current + 1)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_SEMVER: ${{ github.event.inputs.semver }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_SEMVER"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid semver: $VERSION (expected e.g. 1.3.0)" >&2
              exit 1
            fi
            CURRENT_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
            if [ -n "$INPUT_VERSION_CODE" ]; then
              if ! [[ "$INPUT_VERSION_CODE" =~ ^[0-9]+$ ]]; then
                echo "Invalid versionCode: $INPUT_VERSION_CODE" >&2
                exit 1
              fi
              VERSION_CODE="$INPUT_VERSION_CODE"
            else
              VERSION_CODE=$((CURRENT_CODE + 1))
            fi
            if [ "$VERSION_CODE" -le "$CURRENT_CODE" ]; then
              echo "versionCode $VERSION_CODE must be greater than current $CURRENT_CODE" >&2
              exit 1
            fi
            sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
            sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
            echo "Manual release: versionName=$VERSION versionCode=$VERSION_CODE"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            if [ -z "$VERSION" ]; then
              echo "Could not read versionName from app/build.gradle.kts" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip when tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.tag_check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.tag_check.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        if: steps.tag_check.outputs.skip != 'true'
        run: chmod +x gradlew

      - name: Decode CI keystore
        if: steps.tag_check.outputs.skip != 'true'
        uses: ./.github/actions/decode-ci-keystore
        with:
          keystore_base64: ${{ secrets.DIPLOMAT_KEYSTORE_BASE64 }}

      - name: Build debug APK
        if: steps.tag_check.outputs.skip != 'true'
        env:
          DIPLOMAT_REQUIRE_CI_SIGNING: "true"
          DIPLOMAT_KEYSTORE_PASSWORD: ${{ secrets.DIPLOMAT_KEYSTORE_PASSWORD }}
          DIPLOMAT_KEY_ALIAS: ${{ secrets.DIPLOMAT_KEY_ALIAS }}
          DIPLOMAT_KEY_PASSWORD: ${{ secrets.DIPLOMAT_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Create GitHub Release
        if: steps.tag_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk

      - name: Create or update latest tag
        if: steps.tag_check.outputs.skip != 'true'
        run: |
          git config user.email "actions.github@email.com"
          git config user.name "GitHub Actions"
          # Update the `latest` tag to point at the current HEAD so that
          # GET /releases/latest resolves the artifact we just published.
          git tag -f latest
          git push -f origin latest
